name: Flask CI Native

on:
  push:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Принудительно ставим совместимые версии для Flask 0.11
        pip install "Werkzeug==0.16.1" "MarkupSafe==2.0.1" "itsdangerous==1.1.0" "click==7.1.2"

    - name: Smoke test Flask server
      env:
        PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/application
      run: |
        cd application
        python -c "from app import create_app; app = create_app('development'); app.run(port=5000)" &
        sleep 5
        curl -f http://127.0.0.1:5000/ || exit 1