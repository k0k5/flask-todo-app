name: Flask CI Native

on:
  push:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize SQLite Database
      run: |
        python init_db.py

    - name: Smoke test Flask server
      run: |
        python app.py &
        sleep 5
        curl -f http://127.0.0.1:5000/ || exit 1