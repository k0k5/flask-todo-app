name: Flask CI Native

on:
  push:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install "markupsafe==2.0.1"

    - name: Smoke test Flask server
      env:
        PYTHONPATH: ${{ github.workspace }}/application
      run: |
        python manage.py runserver -h 127.0.0.1 -p 5000 &
        sleep 5
        curl -f http://127.0.0.1:5000/ || exit 1