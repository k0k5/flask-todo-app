name: Flask CI Native

on:
  push:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Специально для Flask 0.11, чтобы не было конфликтов с Werkzeug и MarkupSafe
        pip install "Werkzeug==0.16.1" "MarkupSafe==2.0.1" "itsdangerous==1.1.0" "click==7.1.2"

    - name: Smoke test Flask server
      env:
        PYTHONPATH: ${{ github.workspace }}/application
      run: |
        python manage.py runserver -h 127.0.0.1 -p 5000 &
        sleep 5
        curl -f http://127.0.0.1:5000/ || exit 1