name: Flask CI Native

on:
  push:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install "Werkzeug==0.16.1" "MarkupSafe==2.0.1" "itsdangerous==1.1.0" "click==7.1.2"

    - name: Check Python Syntax
      run: |
        python -m compileall .